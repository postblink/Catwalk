name: Bug report
description: Something broke or didn't behave the way you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the preview. A little detail goes a long way — especially your OS and the file/format involved.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I scanned a folder of 3MFs and the viewer showed a blank screen for one of them…
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Catwalk version
      description: The preview build you're on (e.g. v0.1.0-preview.4).
      placeholder: v0.1.0-preview.4
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File format involved
      description: If the issue is tied to a specific model, which format?
      options:
        - "Not file-specific"
        - STL
        - OBJ
        - 3MF
        - G-code
        - Other / mixed
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, list the steps so it can be reproduced.
      placeholder: |
        1. Scan folder X
        2. Click model Y
        3. …
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console output, or a sample file (if you can share one) are all helpful.
    validations:
      required: false
