name: release

# Build native installers for every platform and attach them to a GitHub
# release whenever a version tag is pushed (e.g. `v0.1.0`, `v0.1.0-preview.1`).
# Can also be kicked off manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Intel macs
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Tauri 2 needs webkit2gtk 4.1 → 22.04 is the supported LTS runner.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Catwalk ${{ github.ref_name }}"
          releaseBody: "Preview build — unsigned. Download the installer for your platform from the assets below."
          # Drafted so all four jobs finish uploading before anyone can download a
          # half-populated release. Flip to a published pre-release in the GitHub UI.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
