name: release

# Build native installers for every platform and attach them to a GitHub
# release whenever a version tag is pushed (e.g. `v0.1.0`, `v0.1.0-preview.1`).
# Can also be kicked off manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs to create the release and upload assets.
permissions:
  contents: write

# No dependency/build caches here on purpose: this workflow publishes release
# artifacts, and a poisoned cache entry could end up inside a shipped installer.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Intel macs
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Tauri 2 needs webkit2gtk 4.1 → 22.04 is the supported LTS runner.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Catwalk ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            **These builds are unsigned.** Catwalk has no code-signing certificate
            yet, so your OS will object the first time you open it:

            - **macOS** — Gatekeeper will refuse outright. Right-click the app and
              choose *Open*, then confirm. You only need to do this once.
            - **Windows** — SmartScreen shows a blue warning. Click *More info*,
              then *Run anyway*.
            - **Linux** — no prompt; the AppImage just needs the execute bit.

            Catwalk never moves, renames, or edits your model files. It reads the
            folders you point it at and keeps its own index.

            See the README for what it does and how to report problems.
          # Drafted so all four jobs finish uploading before anyone can download a
          # half-populated release. Review the assets, then publish from the UI.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
